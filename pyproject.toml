[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-obstacle"
version = "0.1.0"
description = "Research tools for feasibility-preserving tensor-train approximation of discrete obstacle problems"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "tt-obstacle contributors"}]
dependencies = ["numpy>=1.24"]
keywords = ["tensor-train", "obstacle-problem", "finite-elements", "numerical-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
tt_obstacle = ["py.typed"]
